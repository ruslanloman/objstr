# docker/cluster.conf -- 3-node local cluster for docker-compose
#
# Topology:
#
#   top (rf=2) ---- shard 0: raw /data/shard0.raw (local)
#       |---------- shard 1: raw /data/shard1.raw (local)
#       |---------- shard 2: node-a (remote S3)
#       |---------- shard 3: node-b (remote S3)
#
#   node-a (rf=1) - shard 0: raw /data/shard0.raw (local)
#       |---------- shard 1: raw /data/shard1.raw (local)
#
#   node-b (rf=1) - shard 0: raw /data/shard0.raw (local)
#       |---------- shard 1: raw /data/shard1.raw (local)
#
# Objects written to top are replicated to 2 of its 4 shards.
# The child nodes store their shards independently.
#
# All three objstrd processes share this config file. Each starts
# with --node <name> to pick its role.

cluster  local-dev
bucket   default

# Global shard defaults
size_mb      256
compression  none

# Daemon options
flush_interval              5
catalog_format              json
catalog_flush_interval      30

# Recovery -- auto-heal when a shard goes down
recovery_enabled                    true
recovery_poll_secs                  10
recovery_probe_timeout_secs         5
recovery_failure_threshold          3
recovery_re_replicate_batch_size    100

# Repair-replication -- periodic background sweep
repair_replication_interval         60
repair_replication_batch_size       500

top  rf=2  listen=0.0.0.0:8000  endpoint=http://top:8000
  raw  /data/shard0.raw
  raw  /data/shard1.raw
  node-a  rf=1  listen=0.0.0.0:8000  endpoint=http://node-a:8000
    raw  /data/shard0.raw
    raw  /data/shard1.raw
  node-b  rf=1  listen=0.0.0.0:8000  endpoint=http://node-b:8000
    raw  /data/shard0.raw
    raw  /data/shard1.raw
