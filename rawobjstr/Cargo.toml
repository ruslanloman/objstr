[package]
name = "rawobjstr"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "ObjectStore trait implementation writing directly to raw block devices or loopback files -- 2-5x faster than filesystem-backed stores"
readme = "README.md"
keywords = ["object-store", "block-device", "storage", "arrow", "lancedb"]
categories = ["filesystem", "database"]

[features]
default = ["aws"]
aws = ["object_store/aws"]
lance = ["dep:lancedb", "dep:lance-io", "dep:lance-core", "dep:arrow-array", "dep:arrow-schema", "dep:url"]
datafusion = ["dep:datafusion", "dep:arrow", "dep:parquet"]

[dependencies]
object_store = "0.12"
async-trait = "0.1"
bytes = "1"
crc32c = "0.6"
bincode = "1"
serde = { version = "1", features = ["derive"] }
tokio = { version = "1", features = ["fs", "io-util", "net", "rt", "rt-multi-thread", "sync", "time"] }
futures = "0.3"
chrono = { version = "0.4", features = ["serde"] }
tracing = "0.1"
thiserror = "2"
parking_lot = "0.12"
zstd = "0.13"
snap = "1"
flate2 = "1"
tempfile = "3"
lancedb = { version = "0.27", optional = true }
lance-io = { version = "4.0", optional = true }
lance-core = { version = "4.0", optional = true }
url = { version = "2", optional = true }
arrow-array = { version = "57", optional = true }
arrow-schema = { version = "57", optional = true }
datafusion = { version = "52", optional = true }
arrow = { version = "57", optional = true }
parquet = { version = "57", optional = true }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tokio = { version = "1", features = ["full", "test-util"] }
rand = "0.8"
url = "2"

[[bin]]
name = "rawobjstr"
path = "src/bin/rawobjstr.rs"

[[example]]
name = "bench_storage"
required-features = []

[[example]]
name = "bench_lance"
required-features = ["lance"]

[[test]]
name = "datafusion_parquet"
required-features = ["datafusion"]

# The example needs tokio rt-multi-thread; dev-dependencies cover it.
