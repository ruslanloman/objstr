[package]
name = "pyrawobjstr"
version = "0.1.0"
edition = "2021"
description = "Python bindings for rawobjstr -- bypass the filesystem for 2-5x faster I/O"
license = "MIT"

[lib]
name = "_rawobjstr"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.22", features = ["extension-module"] }
rawobjstr = { path = ".." }
object_store = "0.12"
tokio = { version = "1", features = ["rt-multi-thread"] }
bytes = "1"
futures = "0.3"
chrono = "0.4"
