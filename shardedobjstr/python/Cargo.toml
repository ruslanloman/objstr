[package]
name = "pyshardedobjstr"
version = "0.1.0"
edition = "2021"
description = "Python bindings for shardedobjstr -- distributed sharded object store"
license = "MIT"

[lib]
name = "_shardedobjstr"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.22", features = ["extension-module"] }
shardedobjstr = { path = ".." }
rawobjstr = { path = "../../rawobjstr" }
object_store = "0.12"
tokio = { version = "1", features = ["rt-multi-thread"] }
bytes = "1"
futures = "0.3"
chrono = "0.4"
parking_lot = "0.12"
